name: Android scaffold and build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files when missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name personal_ai_image_to_video .
          fi
      - name: Patch Android networking for local development
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          if p.exists():
              s=p.read_text()
              if 'android.permission.INTERNET' not in s:
                  s=s.replace('</manifest>', '  <uses-permission android:name="android.permission.INTERNET" />\\n</manifest>')
              if 'android:usesCleartextTraffic=' not in s:
                  s=s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
              p.write_text(s)
          PY
      - name: Dependencies
        run: flutter pub get
      - name: Backend smoke test
        working-directory: server
        run: npm install && npm test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build APK
        run: flutter build apk --release
      - name: Commit generated Android scaffolding
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain android)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android
            git commit -m "Generate Flutter Android scaffolding"
            git push
          fi
